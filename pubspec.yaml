name: leo_robot
description: LEO - AI Talking Robot with Animated Eyes
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  
  # Speech to Text
  speech_to_text: ^6.3.0
  
  # Text to Speech
  flutter_tts: ^0.13.11

  # Bluetooth Serial
  flutter_bluetooth_serial: ^0.4.1
  
  # Gemini API - FIXED VERSION
  google_generative_ai: ^0.4.0
  
  # Permissions - FIXED VERSION (compatible)
  permission_handler: ^11.3.1
  
  # HTTP
  http: ^1.1.0
  
  # Intl
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
