name: leo_robot
description: LEO - AI Talking Robot with Animated Eyes
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.0
  
  # Speech to Text - STABLE
  speech_to_text: ^6.1.1
  
  # Text to Speech - STABLE
  flutter_tts: ^0.13.8

  # Bluetooth - CHANGED TO WORKING VERSION
  flutter_bluetooth_serial: ^0.3.9
  
  # Gemini API - STABLE
  google_generative_ai: ^0.3.0
  
  # Permissions - STABLE
  permission_handler: ^10.4.3
  
  # HTTP - STABLE
  http: ^0.13.5
  
  # Intl - STABLE
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
