name: leo_robot
description: LEO - AI Talking Robot with Animated Eyes
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  speech_to_text: ^6.3.0
  flutter_tts: ^0.13.11
  flutter_bluetooth_serial: ^0.4.1
  google_generative_ai: ^0.4.0
  permission_handler: ^11.4.4
  http: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
